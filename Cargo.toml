[package]
name = "horkos-yield"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Bond mathematics for a bond-investing demo: price and yield, duration, cash flows with amortisation and offers, floaters, tax, holding-period results"
repository = "https://github.com/Valkyra-Labs/horkos-yield"
readme = "README.md"
keywords = ["bonds", "yield", "duration", "finance", "wasm"]
categories = ["finance", "mathematics"]
exclude = ["/twin", "/node", "/fixtures"]

[features]
default = []
# JavaScript bindings for the browser (wasm-bindgen).
wasm = ["dep:wasm-bindgen"]

[dependencies]
wasm-bindgen = { version = "0.2", optional = true }

[dev-dependencies]
serde_json = "1"

[lib]
crate-type = ["cdylib", "rlib"]

# The WebAssembly module ships to the browser. Measured at fd23e70 (60-issue
# set, derive and calculate, best of 300 under Node): opt-level 3 with LTO
# and one codegen unit is 64,861 bytes (24,975 gzipped) at 9.61 ms; the
# default is 68,932 (26,446) at 9.63 ms; "s" 64,454 (25,574) at 9.75 ms;
# "z" 64,571 (25,636) at 9.96 ms.
[profile.release]
lto = true
codegen-units = 1
